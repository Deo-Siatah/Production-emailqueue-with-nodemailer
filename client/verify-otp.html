<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="card">

    <h1>Verify OTP 🔐</h1>

    <p>
        Check your email and enter the code.
    </p>

    <form id="otpForm">

        <input
            id="otp"
            type="text"
            placeholder="Enter OTP"
            required
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

<script src="./js/verifyOtp.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="card">

    <h1>Create Account</h1>

    <form id="signupForm">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Sign Up
        </button>

    </form>

</div>

<script src="./js/signup.js"></script>

</body>
</html>
